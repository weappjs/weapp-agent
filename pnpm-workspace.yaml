packages:
  - apps/*
  - packages/*
  - templates/*
  - '!**/test/**'
  - examples/*
minimumReleaseAge: 0
pmOnFail: error
versioning:
  changelog:
    storage: repository
allowBuilds:
  '@google/genai': false
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: false
  sharp: true
  vue-demi: true
  workerd: true
overrides:
  prettier: 3.9.9
  typescript: 6.0.3
  vite: 8.3.1
  postcss: 8.5.28
  postcss-selector-parser: 7.1.6
  js-yaml: 5.4.2
  nanoid: 6.0.1
  brace-expansion: 5.0.12
  cross-spawn: 7.0.6
  adm-zip: 0.6.1
  uuid: 14.0.2
  esbuild: 0.28.2
